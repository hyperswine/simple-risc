# Standalone LiteDRAM core for the Arty S7-50's DDR3L (MT41K128M16, 16-bit,
# bank 34), for simple-risc's cache. Same PHY and electrical settings as
# LiteDRAM's examples/arty.yml (Arty A7: the same memory and bank design).
# The embedded VexRiscv runs write levelling and read calibration at reset;
# the one native user port carries a whole 16-byte cache line per access
# (16-bit DDR3, burst 8, 1:4 = 128 bits). The controller runs at 80 MHz.
{
    "speedgrade": -1,
    "cpu":        "vexriscv",
    "memtype":    "DDR3",
    "uart":       "rs232",

    "cmd_latency":     0,
    "sdram_module":    "MT41K128M16",
    "sdram_module_nb": 2,
    "sdram_rank_nb":   1,
    "sdram_phy":       "A7DDRPHY",

    "rtt_nom": "60ohm",
    "rtt_wr":  "60ohm",
    "ron":     "34ohm",

    "input_clk_freq":   100e6,
    "sys_clk_freq":     80e6,    # 640 MT/s: the full SoC closed at 80 (102.5 MHz Fmax), not at 100
    "iodelay_clk_freq": 200e6,

    "cmd_buffer_depth": 16,

    "user_ports": {
        "native_0": {
            "type": "native",
        },
    },
}
