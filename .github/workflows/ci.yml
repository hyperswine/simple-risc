name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cabal.project pins with-compiler: ghc-9.8.2 and a freeze file.
      - uses: haskell-actions/setup@v2
        id: hs
        with:
          ghc-version: '9.8.2'
          cabal-version: '3.12.1.0'
      - name: Trust the checkout (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.hs.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-ghc-9.8.2-${{ hashFiles('cabal.project', 'cabal.project.freeze', '*.cabal') }}
          restore-keys: ${{ runner.os }}-ghc-9.8.2-
      - run: cabal update
      - run: cabal build all
      - run: cabal test --test-show-details=direct
      - name: Source field metadata
        run: |
          mkdir -p output
          cabal run -v0 pipeline-layout > output/pipeline-layout.json
      - name: Generated RTL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog verilator gcc-riscv64-unknown-elf
      - name: Diagnostic guest and startup alignment regressions
        run: python3 -m unittest discover -s boards/tangnano20k/sdram -p test_output_diagnostic.py
      - name: Generate and execute fresh IM and IMC pipeline RTL
        timeout-minutes: 30
        run: |
          python3 boards/tangnano20k/bootrom/build_readback_rom.py --out output/ci-readback-rom
          for compressed in 0 1; do
            flags=()
            check_flags=()
            if [ "$compressed" = 1 ]; then
              flags=(-DRISCV_COMPRESSED)
              check_flags=(--compressed)
            fi
            generated="$PWD/output/ci-generated-$compressed"
            cabal run clash -- -isrc -hide-package simple-risc "${flags[@]}" \
              src/SdramPipelineObserved.hs --verilog -fclash-clear -outputdir "$generated"
            python3 boards/tangnano20k/sdram/check_pipeline_rtl.py \
              --generated "$generated/SdramPipelineObserved.topEntity" "${check_flags[@]}" \
              --cache-ways 2 --cache-line-bits 7
            # The ROM's I/U/C/G framed CRC32 upload, end to end through the
            # actual boot ROM, over the one-way geometry and a tiny cache that
            # maximises refill holds while the UART receives.
            python3 boards/tangnano20k/sdram/check_pipeline_rtl.py \
              --generated "$generated/SdramPipelineObserved.topEntity" "${check_flags[@]}" \
              --boot-loader --loader-command U --uart-bit-cycles 32 \
              --cache-ways 1 --cache-line-bits 12
            python3 boards/tangnano20k/sdram/check_pipeline_rtl.py \
              --generated "$generated/SdramPipelineObserved.topEntity" "${check_flags[@]}" \
              --boot-loader --loader-command U --uart-bit-cycles 32 \
              --cache-ways 1 --cache-line-bits 7
            # Real UART timing and a non-executable zero payload distinguish
            # upload acceptance from memory readback and guest computation.
            python3 boards/tangnano20k/sdram/check_pipeline_rtl.py \
              --generated "$generated/SdramPipelineObserved.topEntity" "${check_flags[@]}" \
              --boot-loader --loader-command U --upload-pattern zero --upload-words 16 \
              --cache-ways 2 --cache-line-bits 7 --simulator verilator
            python3 boards/tangnano20k/sdram/check_pipeline_rtl.py \
              --generated "$generated/SdramPipelineObserved.topEntity" "${check_flags[@]}" \
              --boot-loader --loader-command U --upload-pattern sequence --upload-words 16 \
              --raw-readback --rom-file output/ci-readback-rom/readback.hex \
              --cache-ways 2 --cache-line-bits 7 --simulator verilator
          done
      - name: Generated RTL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-rtl-results
          if-no-files-found: warn
          path: |
            output/tangnano20k/pipeline-rtl*/**/*.json
            output/tangnano20k/pipeline-rtl*/**/*.log
            output/pipeline-layout.json
            output/ci-readback-rom/manifest.json

  formal-and-rtl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Formal and RTL tools
        run: sudo apt-get update && sudo apt-get install -y maude iverilog
      - name: Formal gate regressions and all model searches
        run: |
          python3 -m unittest discover -s formal -p test_check_formal.py
          python3 formal/check_formal.py
      - name: Benchmark result guard tests
        run: python3 -m unittest discover -s boards/tangnano20k/sdram -p test_run_perf.py
      - name: Structural evidence parser tests
        run: |
          python3 -m unittest discover -s boards/tangnano20k/sdram -p test_analyze_implementation.py
          python3 -m unittest discover -s boards/tangnano20k/sdram -p test_output_diagnostic.py
      - name: Cache, CDC and instruction-fence RTL checks
        run: |
          python3 boards/tangnano20k/sdram/check_pipeline_cache.py
          python3 boards/tangnano20k/sdram/check_cache_mru.py
          python3 boards/tangnano20k/sdram/check_clock_bridge.py
          python3 boards/tangnano20k/sdram/check_fence_assertion.py
      - name: ROM and preset contracts
        run: |
          python3 boards/tangnano20k/bootrom/check_loader.py
          python3 boards/tangnano20k/test_upload.py
          python3 -m unittest discover -s boards/tangnano20k/sdram -p test_preset_manifest.py
      - name: Formal and RTL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-and-rtl-results
          if-no-files-found: warn
          path: |
            output/formal/*.json
            output/formal/*.log
            output/tangnano20k/pipeline-cache-regression/*.json
            output/tangnano20k/pipeline-cache-regression/*.log
            output/tangnano20k/cache-mru-regression/*.json
            output/tangnano20k/cache-mru-regression/*.log
            output/tangnano20k/sdram-clock-bridge-tests/*.log
            output/tangnano20k/fence-assertion/*.json
            output/tangnano20k/fence-assertion/*.log
            output/tangnano20k/bootrom/host-test/*.log
